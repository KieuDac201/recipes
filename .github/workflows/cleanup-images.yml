name: Cleanup Orphaned Cloudinary Images

on:
  schedule:
    # Chạy mỗi ngày lúc 17:00 UTC (tương đương 00:00 AM giờ Việt Nam UTC+7)
    - cron: '0 17 * * *'
  workflow_dispatch: # Cho phép trigger thủ công từ giao diện GitHub Actions

jobs:
  cleanup-images:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Cloudinary Cleanup API
        run: |
          set -e
          echo "======================================================="
          echo "Triggering Cloudinary Image Cleanup..."
          echo "Target URL: ${{ secrets.API_BASE_URL }}/api/upload/cleanup"
          echo "======================================================="

          # Gọi POST API kèm header x-cron-secret để xác thực
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.API_BASE_URL }}/api/upload/cleanup" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          # Tách phần response body và HTTP status code
          BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          STATUS_CODE=$(echo "$HTTP_RESPONSE" | tail -n1 | sed -e 's/HTTP_STATUS://')

          echo "Response Body: $BODY"
          echo "HTTP Status: $STATUS_CODE"

          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "❌ Error: Cleanup API returned HTTP status $STATUS_CODE"
            exit 1
          fi

          echo "✅ Cloudinary cleanup executed successfully!"
