name: Wake Up API Service

on:
  schedule:
    # Runs every 10 minutes from 8:00 AM to 10:00 PM Vietnam Time (UTC+7)
    # Corresponding UTC hours: 01:00 UTC to 15:00 UTC (01:00 UTC = 08:00 ICT | 15:00 UTC = 22:00 ICT)
    - cron: '*/10 1-17 * * *'
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'URL override to ping (optional, e.g. https://recipes-mixw.onrender.com)'
        required: false
        default: 'https://recipes-mixw.onrender.com'

jobs:
  ping-wake-up:
    name: Ping /wake-up Endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Send GET Request to /wake-up
        env:
          INPUT_URL: ${{ github.event.inputs.custom_url }}
          SECRET_API_URL: ${{ secrets.API_URL || secrets.BACKEND_URL || vars.API_URL }}
        run: |
          set -e

          # Determine target base URL
          BASE_URL="${INPUT_URL:-${SECRET_API_URL:-https://recipes-mixw.onrender.com}}"

          # Strip trailing slash if present
          CLEAN_URL=$(echo "${BASE_URL}" | sed 's:/*$::')
          TARGET_ENDPOINT="${CLEAN_URL}/wake-up"

          echo "=================================================="
          echo "Target Endpoint : ${TARGET_ENDPOINT}"
          echo "UTC Time        : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Vietnam Time    : $(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S ICT (UTC+7)')"
          echo "=================================================="

          # Send HTTP GET with max timeout of 45s (handles free tier cold starts)
          HTTP_RESPONSE=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" --max-time 45 "${TARGET_ENDPOINT}" || true)

          HTTP_BODY=$(echo "${HTTP_RESPONSE}" | sed -e '/HTTP_STATUS:/d' -e '/TIME_TOTAL:/d')
          HTTP_STATUS=$(echo "${HTTP_RESPONSE}" | grep "HTTP_STATUS:" | cut -d':' -f2 || echo "000")
          TIME_TOTAL=$(echo "${HTTP_RESPONSE}" | grep "TIME_TOTAL:" | cut -d':' -f2 || echo "0s")

          echo "Response Body   : ${HTTP_BODY}"
          echo "Status Code     : ${HTTP_STATUS}"
          echo "Total Time      : ${TIME_TOTAL}"

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 400 ]; then
            echo "Success: API is awake and responding healthy!"
          else
            echo "::warning::API returned status ${HTTP_STATUS} (or timed out during cold start)."
          fi
