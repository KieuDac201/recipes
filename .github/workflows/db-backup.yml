name: Daily Neon Postgres Backup

on:
  schedule:
    # Runs daily at 00:00 UTC and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create GitHub Releases

    steps:
      - name: Create Compressed Database Dump with Docker
        run: |
          set -e

          # Tạo tên file theo timestamp (giờ UTC)
          BACKUP_DATE=$(date +"%Y-%m-%d_%H-%M-%S")
          FILENAME="backup_${BACKUP_DATE}.sql.gz"
          TAG_NAME="db-backup-${BACKUP_DATE}"

          # Lưu biến vào môi trường GitHub Actions
          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          # Chạy pg_dump 18 qua Docker container chính thức và nén trực tiếp bằng gzip
          docker run --rm postgres:18-alpine \
            pg_dump "${{ secrets.DATABASE_URL }}" --no-owner --no-acl | gzip > "${FILENAME}"

      - name: Save Backup as GitHub Action Artifact (30 Days)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 30